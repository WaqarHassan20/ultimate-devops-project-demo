# CI workflow for Product Catalog Service

name: product-catalog-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: product-catalog

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        working-directory: src/product-catalog
        run: |
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit tests
        working-directory: src/product-catalog
        run: |
          go test ./...

  code-quality:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run golangci-lint (action)
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.58.0
          args: ./src/product-catalog/...

  docker:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: ${{ secrets.docker_username }}/product-catalog:${{ github.run_id }}

  updateK8s:
    runs-on: ubuntu-latest
    needs: [docker]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN1 }}

      - name: Update the tag in the kubernetes deployment manifest
        run: |
          sed -i 's/image: .*/image: waqarhasan/product-catalog:${{ github.run_id }}/' kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "waqarkhalid2024@gmail.com"
          git config --global user.name "waqarhassan20"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI] Update Product Catalog with tag ${{ github.run_id }}"
          git push origin main
