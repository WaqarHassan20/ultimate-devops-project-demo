# CI workflow for Product Catalog Service

name: product-catalog-ci

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Go setup
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Build
        run: cd src/product-catalog
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit test
        run: cd src/product-catalog
          go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest golangci-lint run src/product-catalog/...

  docker:
    runs-on: ubuntu-latest

    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        run: docker/setup-buildx-action@v2

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: src/product-catalog
          file: Dockerfile
          push: true
          tags: ${{ secrets.docker_username }}/product-catalog:${{ github.run_id }}

  updateK8s:
    runs-on: ubuntu-latest

    needs: [docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update the tag in the kubernetes deployment manifest
        run: |
          sed -i 's/image: .*/image: waqarhasan/product-catalog:${{ github.run_id }}/' kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "waqarkhalid2024@gmail.com"
          git config --global user.name "waqarhassan20"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI] Update Product Catalog with tag ${{ github.run_id }}"
          git push origin main
